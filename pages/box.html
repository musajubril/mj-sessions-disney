<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Disney</title>

            </button>
            <button class="rounded-lg px-3 py-6 text-white transition-all transfrom bg-slate-700 border border-slate-700">
